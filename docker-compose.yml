version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: aagara-mongo
    restart: always
    ports:
      - '27017:27017'
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs0" ]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    container_name: aagara-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongo:27017 --eval "
        try {
          rs.status();
        } catch (err) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          });
        }
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aagara-api
    restart: always
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/aagara?replicaSet=rs0
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
